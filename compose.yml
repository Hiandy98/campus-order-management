services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: campus-order-management-backend
    volumes:
      - ./backend:/app
      - /app/.venv
    env_file:
      - ./backend/.env
    restart: always
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/liveness', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - campus-order-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campus-order-management-frontend
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - campus-order-network

networks:
  campus-order-network:
    driver: bridge