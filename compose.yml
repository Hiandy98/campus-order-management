services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: campus-order-management-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    env_file:
      - ./backend/.env
    restart: always
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/liveness', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - kspgc-network

networks:
  kspgc-network:
    driver: bridge
